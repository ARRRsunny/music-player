    async function toggleSongInPlaylist(playlistId, songId, forceRemove = false) {
        if (String(playlistId) === 'favorites') {
            await toggleFavoriteSong(songId);
            return;
        }
        try {
            const pl = getPlaylistById(playlistId);
            if (!pl) return;
            const isPresent = pl.song_ids.includes(songId);
            const shouldRemove = forceRemove || isPresent;

            const res = await fetch(apiUrl(`/playlists/${playlistId}/songs`), {
                method: shouldRemove ? 'DELETE' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ song_id: songId })
            });
            if (!res.ok) return;

            if (shouldRemove) {
                pl.song_ids = pl.song_ids.filter(id => id !== songId);
            } else if (!pl.song_ids.includes(songId)) {
                pl.song_ids.push(songId);
            }
            renderPlaylistOptions();
            renderSongList();
        } catch (err) {
            console.error('Playlist update error:', err);
        }
    }

    async function toggleFavoriteSong(songId) {
        try {
            const res = await fetch(apiUrl(`/favorites/${songId}`), { method: 'POST' });
            if (!res.ok) return;
            const data = await res.json();
            const song = songs.find(s => s.id === songId);
            if (song) song.favorite = data.favorite;

            ensureFavoritesPlaylist();
            if (songId === currentSongId) {
                el.favCurrentBtn.classList.toggle('active', data.favorite);
            }
            renderPlaylistOptions();
            renderSongList();
        } catch (err) {
            console.error('Favorite error:', err);
        }
    }

    // ==================== WEB AUDIO API ====================
    function initWebAudio() {
        if (audioCtx) return;
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            const source = audioCtx.createMediaElementSource(audioPlayer);

            bassFilter = audioCtx.createBiquadFilter();
            bassFilter.type = 'lowshelf';
            bassFilter.frequency.value = 200;

            midFilter = audioCtx.createBiquadFilter();
            midFilter.type = 'peaking';
            midFilter.frequency.value = 1000;

            trebleFilter = audioCtx.createBiquadFilter();
            trebleFilter.type = 'highshelf';
            trebleFilter.frequency.value = 3200;

            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64;

            source.connect(bassFilter);
            bassFilter.connect(midFilter);
            midFilter.connect(trebleFilter);
            trebleFilter.connect(analyser);
            analyser.connect(audioCtx.destination);

            drawVisualizer();
        } catch (e) {
            console.warn('Web Audio API unavailable:', e);
        }
    }

    function drawVisualizer() {
        const canvas = el.visualizer;
        const ctx = canvas.getContext('2d');
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        function renderFrame() {
            requestAnimationFrame(renderFrame);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!isPlaying) return;

            analyser.getByteFrequencyData(dataArray);
            const barWidth = (canvas.width / bufferLength) - 3;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const barHeight = Math.max(2, (dataArray[i] / 255) * canvas.height);
                ctx.fillStyle = '#FA243C';
                ctx.beginPath();
                ctx.roundRect(x, canvas.height - barHeight, barWidth, barHeight, 2);
                ctx.fill();
                x += barWidth + 3;
            }
        }
        renderFrame();
    }

    // ==================== PLAYBACK & LIVE LYRICS ====================
    async function playSong(songId, options = {}) {
        const song = songs.find(s => s.id === songId);
        if (!song) return;

        initWebAudio();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

        if (options.recordHistory && currentSongId !== null && currentSongId !== songId) {
            playHistory.push(currentSongId);
            if (playHistory.length > 100) playHistory.shift();
        }

        if (currentStreamAbort) {
            currentStreamAbort.abort();
        }
        const abortController = new AbortController();
        currentStreamAbort = abortController;

        currentSongId = songId;
        lastLyricIndex = -1;

        el.songName.textContent = song.title;
        el.songMeta.textContent = `${song.artist} — ${song.album}`;
        el.favCurrentBtn.classList.toggle('active', Boolean(song.favorite));
        el.radioTrack.textContent = `${song.artist} — ${song.title}`;

        const coverUrl = apiUrl(`/${songId}/image`);
        el.songImage.src = coverUrl;
        setAmbientCover(coverUrl);
        el.songImage.onerror = () => {
            el.songImage.src = DEFAULT_COVER;
            setAmbientCover(DEFAULT_COVER);
        };

        apiFetch(`/${songId}/lyrics`)
            .then(r => r.ok ? r.text() : '')
            .then(parseLyrics)
            .catch(() => parseLyrics(''));

        try {
            // 1. Request a single-use, 30-second stream ticket
            const tokenRes = await apiFetch(`/stream/token/${songId}`, {
                method: 'POST',
                signal: abortController.signal
            });
            if (!tokenRes.ok) throw new Error('Could not authorize audio stream');
            const ticket = await tokenRes.json();

            // 2. Fetch the XOR-obfuscated audio stream
            const streamRes = await apiFetch(`/stream/audio/${encodeURIComponent(ticket.token)}`, {
                method: 'GET',
                headers: { 'X-Stream-Client': 'MusicPlayerWeb' },
                signal: abortController.signal
            });
            if (!streamRes.ok) throw new Error('Audio stream fetch failed');

            const encryptedBuffer = await streamRes.arrayBuffer();
            if (abortController.signal.aborted) return;

            // 3. Unmask the audio bytes in memory using the 256-bit pad
            const bytes = new Uint8Array(encryptedBuffer);
            const keyBytes = hexToUint8Array(ticket.key);
            for (let i = 0; i < bytes.length; i++) {
                bytes[i] ^= keyBytes[i & 31];
            }

            // 4. Swap in the new ephemeral Blob URL and immediately revoke the old one
            const blob = new Blob([bytes], { type: ticket.mime || 'audio/mpeg' });
            revokeActiveAudioBlob();
            activeAudioBlobUrl = URL.createObjectURL(blob);

            audioPlayer.src = activeAudioBlobUrl;
            audioPlayer.playbackRate = parseFloat(el.speedSelect.value) || 1;
            await audioPlayer.play().catch(() => {});

            el.coverWrapper.classList.add('is-playing');
            isPlaying = true;
            updatePlayPauseButton();
            renderSongList();
            updateMediaSession(song, coverUrl);
        } catch (err) {
            if (err.name !== 'AbortError') {
                console.error('Secure playback failed:', err);
            }
        }
    }

    function updateMediaSession(song, coverUrl) {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: song.title,
                artist: song.artist,
                album: song.album,
                artwork: [{ src: coverUrl, sizes: '512x512', type: 'image/png' }]
            });
            navigator.mediaSession.setActionHandler('play', togglePlayPause);
            navigator.mediaSession.setActionHandler('pause', togglePlayPause);
            navigator.mediaSession.setActionHandler('previoustrack', previousSong);
            navigator.mediaSession.setActionHandler('nexttrack', nextSong);
        }
    }

    function parseLyrics(lrcText) {
        if (!lrcText || !lrcText.trim()) {
            el.lyricsContainer.replaceChildren(createLyricElement('No lyrics available for this song.'));
            lyricsData = [];
            return;
        }

        const lines = lrcText.split('\n');
        const parsed = [];
        lines.forEach(line => {
            const match = line.match(/\[(\d+):(\d+(?:\.\d+)?)\](.*)/);
            if (match) {
                const time = parseInt(match[1], 10) * 60 + parseFloat(match[2]);
                const text = match[3].trim();
                if (text) parsed.push({ time, text });
            }
        });

        if (parsed.length > 0) {
            lyricsData = parsed;
            el.lyricsContainer.replaceChildren(
                ...lyricsData.map(lyric => createLyricElement(lyric.text, lyric.time))
            );
        } else {
            lyricsData = [];
            el.lyricsContainer.replaceChildren(
                ...lines.filter(l => l.trim()).map(l => {
                    const p = createLyricElement(l.trim());
                    p.style.filter = 'none';
                    p.style.opacity = '0.85';
                    return p;
                })
            );
        }
    }

    function createLyricElement(text, seekTime = null) {
        const p = document.createElement('p');
        p.textContent = text;
        if (seekTime !== null) {
            p.addEventListener('click', () => {
                if (!radiostate) audioPlayer.currentTime = seekTime;
            });
        }
        return p;
    }

    function updateLyricsDisplay(currentTime) {
        if (!lyricsData.length) return;
        const idx = lyricsData.findIndex((lyric, i) => {
            const next = lyricsData[i + 1];
            return currentTime >= lyric.time && (!next || currentTime < next.time);
        });

        if (idx !== -1 && idx !== lastLyricIndex) {
            lastLyricIndex = idx;
            const pList = el.lyricsContainer.getElementsByTagName('p');
            Array.from(pList).forEach((node, i) => node.classList.toggle('highlight', i === idx));
            pList[idx]?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    function togglePlayPause() {
        if (currentSongId === null) {
            const browsed = getBrowsedSongs();
            const initialList = browsed.length ? browsed : songs;
            if (initialList.length > 0) {
                setPlaybackContext(initialList.map(s => s.id), getCurrentBrowseContextLabel(), initialList[0].id);
                const firstId = playbackMode === 'random' ? shuffledQueue[0] : initialList[0].id;
                playSong(firstId, { recordHistory: false });
            }
            return;
        }
        if (isPlaying) {
            audioPlayer.pause();
            el.coverWrapper.classList.remove('is-playing');
        } else {
            if (radiostate) startRadio();
            else {
                audioPlayer.play();
                el.coverWrapper.classList.add('is-playing');
            }
        }
        isPlaying = !isPlaying;
        updatePlayPauseButton();
        renderSongList();
    }

    function updatePlayPauseButton() {
        el.playPauseButton.innerHTML = isPlaying
            ? '<svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>'
            : '<svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    }

    function nextSong() {
        if (radiostate) {
            changeRadioSong('next');
            return;
        }
        if (upNextQueue.length > 0) {
            const nextQueuedId = upNextQueue.shift();
            playSong(nextQueuedId, { recordHistory: true });
            return;
        }

        const activeOrder = getActiveOrderedQueue();
        if (!activeOrder.length) return;

        const curIdx = activeOrder.indexOf(currentSongId);
        if (curIdx === -1) {
            playSong(activeOrder[0], { recordHistory: true });
            return;
        }

        // If at the end of a shuffled pass, reshuffle for the next cycle avoiding immediate repeat
        if (playbackMode === 'random' && curIdx === activeOrder.length - 1 && activeOrder.length > 1) {
            shuffledQueue = buildShuffledQueue(playbackQueue, null);
            if (shuffledQueue[0] === currentSongId) {
                const swapIdx = Math.floor(Math.random() * (shuffledQueue.length - 1)) + 1;
                [shuffledQueue[0], shuffledQueue[swapIdx]] = [shuffledQueue[swapIdx], shuffledQueue[0]];
            }
            playSong(shuffledQueue[0], { recordHistory: true });
            return;
        }

        const nextIdx = (curIdx + 1) % activeOrder.length;
        playSong(activeOrder[nextIdx], { recordHistory: true });
    }

    function previousSong() {
        if (radiostate) {
            changeRadioSong('previous');
            return;
        }
        if (audioPlayer.currentTime > 3) {
            audioPlayer.currentTime = 0;
            return;
        }
        while (playHistory.length > 0) {
            const prevId = playHistory.pop();
            if (songs.some(s => s.id === prevId)) {
                playSong(prevId, { recordHistory: false });
                return;
            }
        }
        const activeOrder = getActiveOrderedQueue();
        if (!activeOrder.length) return;
        const curIdx = activeOrder.indexOf(currentSongId);
        const prevIdx = curIdx > 0 ? curIdx - 1 : activeOrder.length - 1;
        playSong(activeOrder[prevIdx], { recordHistory: false });
    }

    function handleSongEnd() {
        if (upNextQueue.length > 0) {
            playSong(upNextQueue.shift(), { recordHistory: true });
            return;
        }
        if (playbackMode === 'loop') {
            playSong(currentSongId, { recordHistory: false });
        } else if (playbackMode === 'random' || playbackMode === 'queue') {
            nextSong();
        } else if (playbackMode === 'once') {
            isPlaying = false;
            updatePlayPauseButton();
            el.coverWrapper.classList.remove('is-playing');
        } else if (playbackMode === 'radio') {
            startRadio();
        }
    }

    function setPlaybackModeUI(mode) {
        playbackMode = mode;
        el.modeInputs.forEach(input => {
            input.checked = (input.value === mode);
        });
        radiostate = playbackMode === 'radio';
        if (playbackMode === 'random') {
            shuffledQueue = buildShuffledQueue(playbackQueue, currentSongId);
        }
        updateRightPaneView();
    }

    // ==================== RADIO ====================
    function startRadio() {
        fetch(apiUrl('/radio'))
            .then(r => r.json())
            .then(data => {
                playSong(data[0], { recordHistory: false });
                const [mins, secs] = data[1].split(':').map(Number);
                audioPlayer.currentTime = mins * 60 + secs;
            })
            .catch(err => console.error('Radio error:', err));
    }

    async function changeRadioSong(direction) {
        if (!radiostate) return;
        try {
            const res = await fetch(apiUrl(`/radio/${direction}`), { method: 'POST' });
            const data = await res.json();
            await playSong(data.song_id, { recordHistory: false });
            audioPlayer.currentTime = 0;
        } catch (err) {
            console.error('Radio switch failed:', err);
        }
    }

    // ==================== EVENT LISTENERS ====================
    el.authForm.addEventListener('submit', submitAuthentication);
    el.authSwitch.addEventListener('click', toggleAuthMode);
    el.logoutButton.addEventListener('click', logout);

    el.playPauseButton.addEventListener('click', togglePlayPause);
    el.nextBtn.addEventListener('click', nextSong);
    el.prevBtn.addEventListener('click', previousSong);

    el.favCurrentBtn.addEventListener('click', () => {
        if (currentSongId !== null) toggleFavoriteSong(currentSongId);
    });

    el.progressBar.addEventListener('click', (e) => {
        if (radiostate || !audioPlayer.duration) return;
        const rect = el.progressBar.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        audioPlayer.currentTime = (clickX / rect.width) * audioPlayer.duration;
    });

    audioPlayer.addEventListener('timeupdate', () => {
        const cur = audioPlayer.currentTime;
        const dur = audioPlayer.duration || 0;
        el.progress.style.width = dur ? `${(cur / dur) * 100}%` : '0%';
        el.timeCurrent.textContent = formatTime(cur);
        el.timeDuration.textContent = dur ? `-${formatTime(dur - cur)}` : '-0:00';
        updateLyricsDisplay(cur);
    });

    audioPlayer.addEventListener('progress', () => {
        if (audioPlayer.duration > 0 && audioPlayer.buffered.length > 0) {
            const end = audioPlayer.buffered.end(audioPlayer.buffered.length - 1);
            el.cacheProgress.style.width = `${(end / audioPlayer.duration) * 100}%`;
        }
    });

    audioPlayer.addEventListener('ended', handleSongEnd);

    el.volumeSlider.addEventListener('input', () => {
        audioPlayer.volume = el.volumeSlider.value;
        audioPlayer.muted = false;
        localStorage.setItem('mp_volume', el.volumeSlider.value);
    });

    el.muteBtn.addEventListener('click', () => {
        audioPlayer.muted = !audioPlayer.muted;
        el.muteBtn.style.opacity = audioPlayer.muted ? '0.35' : '1';
    });

    el.speedSelect.addEventListener('change', () => {
        audioPlayer.playbackRate = parseFloat(el.speedSelect.value);
    });

    el.eqToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        el.eqPanel.classList.toggle('open');
        el.eqToggleBtn.classList.toggle('active');
    });

    document.addEventListener('click', (e) => {
        if (el.eqPanel.classList.contains('open') && !el.eqPanel.contains(e.target) && e.target !== el.eqToggleBtn) {
            el.eqPanel.classList.remove('open');
            el.eqToggleBtn.classList.remove('active');
        }
        if (el.playlistPickerMenu.classList.contains('open') && !el.playlistPickerMenu.contains(e.target)) {
            el.playlistPickerMenu.classList.remove('open');
        }
    });

    el.eqBass.addEventListener('input', () => { if (bassFilter) bassFilter.gain.value = el.eqBass.value; });
    el.eqMid.addEventListener('input', () => { if (midFilter) midFilter.gain.value = el.eqMid.value; });
    el.eqTreble.addEventListener('input', () => { if (trebleFilter) trebleFilter.gain.value = el.eqTreble.value; });

    el.sleepTimerSelect.addEventListener('change', () => {
        if (sleepTimeoutId) clearTimeout(sleepTimeoutId);
        const mins = parseInt(el.sleepTimerSelect.value, 10);
        if (mins > 0) {
            sleepTimeoutId = setTimeout(() => {
                if (isPlaying) togglePlayPause();
                el.sleepTimerSelect.value = '0';
            }, mins * 60 * 1000);
        }
    });

    el.modeInputs.forEach(input => {
        input.addEventListener('change', (e) => {
            setPlaybackModeUI(e.target.value);
            if (radiostate) startRadio();
            else renderSongList();
        });
    });

    el.radioPrevious.addEventListener('click', () => changeRadioSong('previous'));
    el.radioNext.addEventListener('click', () => changeRadioSong('next'));

    el.searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderSongList();
    });

    el.tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            el.tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeTab = btn.dataset.tab;
            renderSongList();
        });
    });

    el.playlistSelect.addEventListener('change', () => {
        selectedPlaylistId = el.playlistSelect.value;
        const currentPl = getPlaylistById(selectedPlaylistId);
        el.deletePlaylistBtn.disabled = !currentPl || Boolean(currentPl.is_system) || String(currentPl.id) === 'favorites';
        renderSongList();
    });

    el.playPlaylistBtn.addEventListener('click', () => {
        const list = getBrowsedSongs();
        if (!list.length) return;
        if (playbackMode === 'random' || playbackMode === 'radio') {
            setPlaybackModeUI('queue');
        }
        setPlaybackContext(list.map(s => s.id), getCurrentBrowseContextLabel(), list[0].id);
        playSong(list[0].id, { recordHistory: true });
    });

    el.shufflePlaylistBtn.addEventListener('click', () => {
        const list = getBrowsedSongs();
        if (!list.length) return;
        setPlaybackModeUI('random');
        const ids = list.map(s => s.id);
        const randomStartId = ids[Math.floor(Math.random() * ids.length)];
        setPlaybackContext(ids, getCurrentBrowseContextLabel(), randomStartId);
        playSong(randomStartId, { recordHistory: true });
    });

    el.newPlaylistBtn.addEventListener('click', async () => {
        const name = prompt('New Playlist Name:');
        if (!name || !name.trim()) return;
        const res = await fetch(apiUrl('/playlists'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name.trim() })
        });
        if (res.ok) {
            const created = await res.json();
            selectedPlaylistId = String(created.id);
            await loadLibraryAndPlaylists();
        } else {
            const err = await res.json().catch(() => ({}));
            if (err.error) alert(err.error);
        }
    });

    el.deletePlaylistBtn.addEventListener('click', async () => {
        if (!selectedPlaylistId || selectedPlaylistId === 'favorites') return;
        if (!confirm('Delete this playlist?')) return;
        await fetch(apiUrl(`/playlists/${selectedPlaylistId}`), { method: 'DELETE' });
        selectedPlaylistId = 'favorites';
        await loadLibraryAndPlaylists();
    });

    el.rescanBtn.addEventListener('click', async () => {
        await fetch(apiUrl('/library/rescan'), { method: 'POST' });
        await loadLibraryAndPlaylists();
    });

    el.themeButton.addEventListener('click', () => {
        theme = theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('mp_theme', theme);
        document.documentElement.setAttribute('data-theme', theme);
    });

    el.gitBtn.addEventListener('click', () => window.open('https://github.com/ARRRsunny/music-player'));

    window.addEventListener('keydown', (e) => {
        if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;
        if (e.code === 'Space') {
            e.preventDefault();
            togglePlayPause();
        } else if (e.code === 'ArrowRight') {
            if (!radiostate && audioPlayer.duration) audioPlayer.currentTime = Math.min(audioPlayer.duration, audioPlayer.currentTime + 5);
        } else if (e.code === 'ArrowLeft') {
            if (!radiostate && audioPlayer.duration) audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - 5);
        } else if (e.key.toLowerCase() === 'm') {
            el.muteBtn.click();
        }
    });

    checkAuthentication();
})();
</script>
</body>
</html>
